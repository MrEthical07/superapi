name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: superapi
          POSTGRES_PASSWORD: superapi
          POSTGRES_DB: superapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superapi -d superapi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      POSTGRES_URL: postgres://superapi:superapi@127.0.0.1:5432/superapi?sslmode=disable
      # Enables the Postgres integration tests (internal/core/db/dbtest).
      SUPERAPI_TEST_DATABASE_URL: postgres://superapi:superapi@127.0.0.1:5432/superapi?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Go env
        run: go env

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code

      - name: Format check
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      # Version pinned to the one recorded in internal/core/db/sqlcgen headers.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: sqlc drift check
        run: |
          make sqlc-generate SQLC="$(go env GOPATH)/bin/sqlc"
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "sqlc-generate produced untracked files"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Architecture and env verify
        run: go run ./cmd/superapi-verify ./...

      - name: Migrations (up, down, up)
        run: |
          make migrate-up
          for i in 1 2 3 4 5 6; do make migrate-down; done
          make migrate-up

      - name: Test
        run: go test ./... -race

      - name: Test (TENANCY_ENABLED=true)
        run: TENANCY_ENABLED=true go test ./... -race

      - name: Install golangci-lint
        run: |
          GOBIN=$(go env GOPATH)/bin go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.6

      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Install CycloneDX SBOM tool
        run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest

      - name: Generate SBOM
        run: cyclonedx-gomod mod -licenses -json -output sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
